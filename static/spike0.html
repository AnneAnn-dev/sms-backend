<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spike 0</title>
<link rel="manifest" href="/spike0-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spike 0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* SPIKE 0 - midlertidig testside. Kun staging. Slettes efter testen.
     Siden sender INTET over nettet. Lyden forlader kun telefonen,
     hvis du selv trykker "Del fil". */
  :root { --bg:#F4F7FA; --fg:#1A2530; --mut:#5A6B7B; --kort:#fff; --rod:#B42318; --blaa:#1A3A5C; --gron:#1E7B45; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.4 -apple-system, system-ui, sans-serif;
         padding:max(16px, env(safe-area-inset-top)) 16px 40px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .mut { color:var(--mut); font-size:14px; }
  .kort { background:var(--kort); border-radius:12px; padding:14px; margin:12px 0;
          box-shadow:0 1px 2px rgba(0,0,0,.06); }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:14px;
           width:100%; margin:6px 0; background:var(--blaa); color:#fff; }
  button:disabled { opacity:.4; }
  button.rod { background:var(--rod); }
  button.lys { background:#E4EAF0; color:var(--fg); }
  .ur { font:700 40px/1 ui-monospace, Menlo, monospace; text-align:center; margin:8px 0; }
  .fakta { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:14px; }
  .fakta b { font-weight:600; }
  .fakta span { word-break:break-all; }
  #log { font:12px/1.35 ui-monospace, Menlo, monospace; white-space:pre-wrap;
         max-height:280px; overflow:auto; background:#0F1720; color:#D6E2EE;
         padding:10px; border-radius:8px; }
  audio, img { width:100%; margin-top:8px; border-radius:8px; }
  label.valg { display:flex; gap:8px; align-items:center; font-size:14px; margin:6px 0; }
  .ok { color:var(--gron); font-weight:600; }
  .fejl { color:var(--rod); font-weight:600; }
</style>
</head>
<body>

<h1>Spike 0</h1>
<div class="mut">Test af mikrofon og kamera. Intet sendes over nettet.</div>

<div class="kort">
  <h2>Tilstand</h2>
  <div class="fakta" id="tilstand"></div>
</div>

<div class="kort">
  <h2>1. Optag lyd</h2>
  <div class="ur" id="ur">0:00</div>
  <div class="mut" style="text-align:center" id="urTekst">Mål: mindst 2:30</div>
  <label class="valg"><input type="checkbox" id="udenSkive"> Optag uden tidsskiver (hvis filen er i stykker)</label>
  <button id="start">Start optagelse</button>
  <button id="stop" class="rod" disabled>Stop</button>
  <div id="resultat"></div>
</div>

<div class="kort">
  <h2>2. Tag et foto</h2>
  <input type="file" accept="image/*" capture="environment" id="foto">
  <div id="fotoInfo"></div>
</div>

<div class="kort">
  <h2>Logbog</h2>
  <button class="lys" id="kopier">Kopier logbog</button>
  <div id="log"></div>
</div>

<script>
(function () {
  "use strict";

  // ---------- logbog ----------
  var t0 = Date.now();
  var linjer = [];
  var logEl = document.getElementById("log");
  function tid() {
    var d = new Date();
    function p(n, l) { n = String(n); while (n.length < (l || 2)) n = "0" + n; return n; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "." + p(d.getMilliseconds(), 3);
  }
  function log(tekst) {
    var l = tid() + "  " + tekst;
    linjer.push(l);
    logEl.textContent = linjer.join("\n");
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ---------- tilstand ----------
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                   window.navigator.standalone === true;
  var kandidater = ["audio/mp4", "audio/mp4;codecs=mp4a.40.2", "audio/aac",
                    "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/wav"];
  var understoettet = [];
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
    kandidater.forEach(function (m) { if (MediaRecorder.isTypeSupported(m)) understoettet.push(m); });
  }
  function fakta(el, par) {
    el.innerHTML = "";
    par.forEach(function (p) {
      var b = document.createElement("b"); b.textContent = p[0];
      var s = document.createElement("span"); s.textContent = p[1];
      if (p[2]) s.className = p[2];
      el.appendChild(b); el.appendChild(s);
    });
  }
  var tilstandPar = [
    ["Hjemmeskærm", standalone ? "JA (installeret app)" : "NEJ (åbnet i Safari)", standalone ? "ok" : "fejl"],
    ["mediaDevices", navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? "findes" : "MANGLER"],
    ["MediaRecorder", window.MediaRecorder ? "findes" : "MANGLER"],
    ["Formater", understoettet.length ? understoettet.join(", ") : "(ingen af kandidaterne)"],
    ["Browser", navigator.userAgent]
  ];
  fakta(document.getElementById("tilstand"), tilstandPar);
  log("SIDE ÅBNET. standalone=" + standalone);
  log("formater: " + (understoettet.join(", ") || "ingen"));
  log("UA: " + navigator.userAgent);

  // Mikrofon-tilladelse, hvis browseren vil sige det
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: "microphone" }).then(function (st) {
      log("tilladelse ved start: " + st.state);
      st.onchange = function () { log("tilladelse ændret: " + st.state); };
    }).catch(function (e) { log("tilladelse kan ikke læses: " + e.name); });
  } else {
    log("tilladelse kan ikke læses (permissions-API mangler)");
  }

  // ---------- livscyklus: skærmlås og app-skift ----------
  document.addEventListener("visibilitychange", function () {
    log("SYNLIGHED: " + document.visibilityState + (optager() ? "  [optager]" : ""));
  });
  window.addEventListener("pagehide", function () { log("pagehide"); });
  window.addEventListener("pageshow", function (e) { log("pageshow (fra cache: " + e.persisted + ")"); });
  window.addEventListener("blur", function () { log("blur"); });
  window.addEventListener("focus", function () { log("focus"); });

  // ---------- optagelse ----------
  var rec = null, strom = null, stykker = [], startTid = 0, urTimer = null;
  var sidsteStykke = 0, stoersteHul = 0, antalStykker = 0;
  var btnStart = document.getElementById("start");
  var btnStop = document.getElementById("stop");
  var urEl = document.getElementById("ur");
  var urTekst = document.getElementById("urTekst");
  var resultatEl = document.getElementById("resultat");

  function optager() { return rec && rec.state === "recording"; }
  function mmss(sek) {
    sek = Math.round(sek);
    var m = Math.floor(sek / 60), s = sek % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function endelse(mime) {
    if (/mp4|aac/.test(mime)) return "mp4";
    if (/webm/.test(mime)) return "webm";
    if (/ogg/.test(mime)) return "ogg";
    if (/wav/.test(mime)) return "wav";
    return "bin";
  }

  btnStart.onclick = function () {
    resultatEl.innerHTML = "";
    log("getUserMedia kaldt (se om iOS spørger om lov)");
    var kaldt = Date.now();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      var ventet = Date.now() - kaldt;
      log("mikrofon givet efter " + ventet + " ms" + (ventet > 800 ? "  (sandsynligvis spurgt)" : "  (sandsynligvis IKKE spurgt)"));
      strom = s;
      var spor = s.getAudioTracks()[0];
      if (spor) {
        var inds = spor.getSettings ? spor.getSettings() : {};
        log("spor: " + spor.label + "  indstillinger: " + JSON.stringify(inds));
        spor.onmute = function () { log("SPOR MUTE (lyden stoppet af systemet)"); };
        spor.onunmute = function () { log("spor unmute"); };
        spor.onended = function () { log("SPOR ENDED (mikrofonen taget fra os)"); };
      }
      try {
        rec = new MediaRecorder(s); // lad iOS vælge selv - det er det, vi vil se
      } catch (e) {
        log("MediaRecorder FEJL: " + e.name + " " + e.message);
        stopStrom();
        return;
      }
      log("recorder.mimeType = '" + rec.mimeType + "'");
      stykker = []; antalStykker = 0; stoersteHul = 0;
      rec.ondataavailable = function (e) {
        var nu = Date.now();
        if (e.data && e.data.size > 0) stykker.push(e.data);
        antalStykker++;
        if (sidsteStykke) {
          var hul = nu - sidsteStykke;
          if (hul > stoersteHul) stoersteHul = hul;
          if (hul > 2500) log("HUL mellem stykker: " + (hul / 1000).toFixed(1) + " s");
        }
        sidsteStykke = nu;
      };
      rec.onpause = function () { log("recorder PAUSE"); };
      rec.onresume = function () { log("recorder resume"); };
      rec.onerror = function (e) { log("recorder FEJL: " + (e.error ? e.error.name : "ukendt")); };
      rec.onstop = faerdig;
      var udenSkive = document.getElementById("udenSkive").checked;
      startTid = Date.now(); sidsteStykke = 0;
      if (udenSkive) { rec.start(); log("START (uden tidsskiver)"); }
      else { rec.start(1000); log("START (tidsskive 1 s)"); }
      btnStart.disabled = true; btnStop.disabled = false;
      urTimer = setInterval(function () {
        var sek = (Date.now() - startTid) / 1000;
        urEl.textContent = mmss(sek);
        if (sek >= 150) { urTekst.textContent = "2:30 nået"; urTekst.className = "ok"; }
      }, 250);
    }).catch(function (e) {
      log("mikrofon AFVIST: " + e.name + " " + e.message);
      resultatEl.innerHTML = '<p class="fejl">Ingen mikrofon: ' + e.name + "</p>";
    });
  };

  btnStop.onclick = function () {
    if (rec && rec.state !== "inactive") { log("STOP trykket"); rec.stop(); }
  };

  function stopStrom() {
    if (strom) { strom.getTracks().forEach(function (t) { t.stop(); }); strom = null; }
  }

  function faerdig() {
    clearInterval(urTimer);
    var vaegur = (Date.now() - startTid) / 1000;
    stopStrom();
    btnStart.disabled = false; btnStop.disabled = true;
    var mime = rec.mimeType || (stykker[0] && stykker[0].type) || "";
    var blob = new Blob(stykker, { type: mime });
    var navn = "spike0-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + "." + endelse(mime);
    log("STOPPET. vægur " + vaegur.toFixed(1) + " s, " + antalStykker + " stykker, største hul " +
        (stoersteHul / 1000).toFixed(1) + " s, " + (blob.size / 1024).toFixed(0) + " KB, type '" + blob.type + "'");

    var par = [
      ["Fil", navn],
      ["mimeType", mime || "(tom)"],
      ["Størrelse", (blob.size / 1024).toFixed(0) + " KB"],
      ["Vægur", vaegur.toFixed(1) + " s"],
      ["Lydlængde", "måler ..."],
      ["Største hul", (stoersteHul / 1000).toFixed(1) + " s"]
    ];
    var box = document.createElement("div");
    box.className = "fakta"; box.style.marginTop = "10px";
    resultatEl.appendChild(box);
    fakta(box, par);

    var url = URL.createObjectURL(blob);
    var lyd = document.createElement("audio");
    lyd.controls = true; lyd.src = url;
    resultatEl.appendChild(lyd);

    // Mål den reelle lydlængde ved at afkode filen. Afviger den meget fra
    // vægur, er der tabt lyd under skærmlås/app-skift.
    blob.arrayBuffer().then(function (buf) {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      return new Promise(function (ok, fejl) { ctx.decodeAudioData(buf, ok, fejl); })
        .then(function (lydbuf) {
          var d = lydbuf.duration;
          var tab = vaegur - d;
          par[4] = ["Lydlængde", d.toFixed(1) + " s (tab " + tab.toFixed(1) + " s)", tab > 3 ? "fejl" : "ok"];
          fakta(box, par);
          log("AFKODET OK: lydlængde " + d.toFixed(1) + " s, " + lydbuf.sampleRate + " Hz, " +
              lydbuf.numberOfChannels + " kanal(er). Tab mod vægur: " + tab.toFixed(1) + " s");
          if (ctx.close) ctx.close();
        });
    }).catch(function (e) {
      par[4] = ["Lydlængde", "KAN IKKE AFKODES (" + (e && e.name) + ")", "fejl"];
      fakta(box, par);
      log("AFKODNING FEJLEDE: " + (e && e.name) + " - prøv igen med 'uden tidsskiver'");
    });

    // Få filen over på pc'en: Del-arket (Mail til dig selv / Gem i Filer)
    var fil = new File([blob], navn, { type: mime });
    var del = document.createElement("button");
    del.textContent = "Del fil (mail den til dig selv)";
    del.onclick = function () {
      if (navigator.canShare && navigator.canShare({ files: [fil] })) {
        navigator.share({ files: [fil], title: navn }).then(function () {
          log("delt: " + navn);
        }).catch(function (e) { log("deling afbrudt: " + e.name); });
      } else {
        log("deling af filer understøttes ikke - bruger download");
        var a = document.createElement("a");
        a.href = url; a.download = navn; document.body.appendChild(a); a.click(); a.remove();
      }
    };
    resultatEl.appendChild(del);
  }

  // ---------- foto ----------
  document.getElementById("foto").onchange = function (e) {
    var f = e.target.files && e.target.files[0];
    var info = document.getElementById("fotoInfo");
    info.innerHTML = "";
    if (!f) { log("foto: intet valgt"); return; }
    var par = [
      ["Navn", f.name],
      ["Type", f.type || "(tom)"],
      ["Størrelse", (f.size / 1024).toFixed(0) + " KB"],
      ["Mål", "måler ..."]
    ];
    var box = document.createElement("div");
    box.className = "fakta"; box.style.marginTop = "10px";
    info.appendChild(box); fakta(box, par);
    var img = document.createElement("img");
    img.onload = function () {
      par[3] = ["Mål", img.naturalWidth + " x " + img.naturalHeight + " px"];
      fakta(box, par);
      log("FOTO: " + f.name + ", type '" + f.type + "', " + (f.size / 1024).toFixed(0) + " KB, " +
          img.naturalWidth + "x" + img.naturalHeight);
    };
    img.onerror = function () {
      par[3] = ["Mål", "kan ikke vises", "fejl"];
      fakta(box, par);
      log("FOTO kan ikke vises: " + f.name + ", type '" + f.type + "'");
    };
    img.src = URL.createObjectURL(f);
    info.appendChild(img);
  };

  // ---------- kopier logbog ----------
  document.getElementById("kopier").onclick = function () {
    var tekst = linjer.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tekst).then(function () { log("logbog kopieret"); })
        .catch(function () { vaelg(); });
    } else { vaelg(); }
    function vaelg() {
      var r = document.createRange(); r.selectNodeContents(logEl);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      log("markér og kopiér selv");
    }
  };
})();
</script>
</body>
</html>
