# S11 - forsyningskaede.
#
# Formaalet er ET tjek, der kun kan blive roedt af en aegte grund. Moderate og
# lavere rapporteres, men blokerer ikke - et tjek der er roedt hele tiden laerer
# en at ignorere roedt (samme laerdom som noeglescanningen 19/8).
#
# OBS: GRAENSEN ER SAT TIL "high" - og det er et BEVIDST VALG, ikke en
#   standardvaerdi.
#
#   HISTORIK: graensen stod paa "critical" fra 27/8-26 til 24/9-26. Aarsagen
#   var S22: fund i @opentelemetry/core <2.8.0 inde i @appsignal/nodejs 3.8.1,
#   hvor npm's egen "fix" ville NEDGRADERE AppSignal til 3.4.2.
#
#   S22 ER LUKKET 24/9-26. AppSignal 3.9.1 (PR #62) bruger otel-core 2.10.0,
#   og de to fund er dermed ude af traeet. Det var praecis den re-trigger,
#   undtagelsen var skrevet til at vente paa. Listen over accepterede fund er
#   derfor fjernet - der er ingen tilbage. "npm audit --omit=dev" gav 0 fund
#   paa PR #62's laasefil.
#
#   HVIS EN NY UNDTAGELSE BLIVER NOEDVENDIG: saenk ikke graensen i stilhed.
#   Skriv fundet ind i RISIKOREGISTER.md med en re-trigger og en dato, og
#   genindfoer trinnet "Kendte, accepterede fund", saa undtagelsen staar i
#   hver eneste koersel i stedet for kun i denne kommentar.

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  afhaengigheder:
    name: Afhaengigheder
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      # Node-versionen laeses af "engines" i package.json - samme felt som
      # Railpack bruger til at vaelge Node paa Railway. Et tal, to forbrugere,
      # ingen dublet (AA2).
      - name: Node - samme version som produktion
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      # Skrives ud, saa den kan sammenlignes med Railways build-log med oejnene.
      - name: Vis Node-version
        run: node -v

      # "npm ci" fejler, hvis package.json og package-lock.json er uenige.
      # Det er i sig selv et tjek: laasefilen kan ikke sakke bagud ubemaerket.
      - name: Installer praecis det, laasefilen siger
        run: npm ci --omit=dev

      # BLOKERENDE. Se graense-noten oeverst.
      - name: Sikkerhedsgennemgang (blokerende)
        run: npm audit --omit=dev --audit-level=high

      # IKKE-BLOKERENDE, men SKAL laeses: her dukker moderate og lavere op,
      # som graensen ovenfor bevidst lader passere.
      - name: Fuld rapport (blokerer aldrig - men laes den)
        if: always()
        run: npm audit --omit=dev || true

  # SPIKE-VAGT (21/9-26, Spike 0).
  #
  # Testsider til spikes (static/spike*, tilbud/spike*) maa ligge paa staging,
  # men ALDRIG naa main. Dette job fejler en PR mod main, hvis bare en af dem
  # stadig findes i resultatet af merget. Paa PR mod staging og ved push
  # springes den over (vises som "skipped", som taeller som groen).
  #
  # ENDNU IKKE SAT SOM PAAKRAEVET TJEK i main's ruleset (24/9-26). Indtil det
  # sker, er roedt kun en advarsel, og en PR med spike-filer kan merges alligevel.
  spike-vagt:
    name: Ingen spike-filer i main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Afvis spike-filer
        run: |
          fund=$(git ls-files 'static/spike*' 'tilbud/spike*')
          if [ -n "$fund" ]; then
            echo "STOP: spike-filer maa ikke med til main:"
            echo "$fund"
            echo "Slet dem paa staging foerst, og opdater PR'en."
            exit 1
          fi
          echo "OK: ingen spike-filer."